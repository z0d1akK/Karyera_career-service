databaseChangeLog:

  - changeSet:
      id: 007-create-employee-career-goals
      author: zodiakk

      changes:
        - createTable:
            tableName: employee_career_goals
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: target_position_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: target_grade_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: target_node_id
                  type: UUID
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: motivation
                  type: TEXT
              - column:
                  name: target_date
                  type: DATE
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: employee_career_goals
            baseColumnNames: target_node_id
            referencedTableName: career_track_nodes
            referencedColumnNames: id
            constraintName: fk_career_goal_node
