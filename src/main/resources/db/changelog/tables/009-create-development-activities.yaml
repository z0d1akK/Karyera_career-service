databaseChangeLog:

  - changeSet:
      id: 009-create-development-activities
      author: zodiakk

      changes:
        - createTable:
            tableName: development_activities
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: skill_id
                  type: UUID
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: activity_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(25)
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: assigned_by
                  type: UUID
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: development_activities
            baseColumnNames: plan_id
            referencedTableName: development_plans
            referencedColumnNames: id
            constraintName: fk_development_activity_plan
