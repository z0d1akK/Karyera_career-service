databaseChangeLog:

  - changeSet:
      id: 012-create-talent-reserves
      author: zodiakk

      changes:
        - createTable:
            tableName: talent_reserves
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: target_position_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: target_grade_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: effective_from
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: effective_to
                  type: DATE
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: false

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE talent_reserves ADD CONSTRAINT chk_talent_reserve_dates CHECK (effective_to IS NULL OR effective_to >= effective_from);
