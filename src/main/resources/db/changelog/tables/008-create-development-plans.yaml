databaseChangeLog:

  - changeSet:
      id: 008-create-development-plans
      author: zodiakk

      changes:
        - createTable:
            tableName: development_plans
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: career_goal_id
                  type: UUID
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(25)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: target_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: approved_by
                  type: UUID
              - column:
                  name: approved_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: development_plans
            baseColumnNames: career_goal_id
            referencedTableName: employee_career_goals
            referencedColumnNames: id
            constraintName: fk_development_plan_goal

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE development_plans ADD CONSTRAINT chk_development_plan_dates CHECK (target_date >= start_date);
